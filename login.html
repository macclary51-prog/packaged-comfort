<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Log in to your Packaged Comfort customer or administrator account."
    >

    <title>Log In | Packaged Comfort</title>

    <link
        rel="icon"
        type="image/png"
        href="logo.png"
    >

    <link
        rel="stylesheet"
        href="style.css"
    >

    <style>
        .auth-page {
            min-height: calc(100vh - 80px);
            padding: 70px 0;
            background:
                linear-gradient(
                    135deg,
                    #f5f7fa,
                    #fff7f1
                );
        }

        .auth-card {
            width: min(520px, 100%);
            margin: 0 auto;
            border: 1px solid rgba(23, 35, 59, 0.1);
            border-radius: 24px;
            padding: 34px;
            background: white;
            box-shadow:
                0 24px 65px rgba(23, 35, 59, 0.12);
        }

        .auth-card h1 {
            margin-bottom: 9px;
            text-align: center;
        }

        .auth-card > p {
            margin: 0 auto 26px;
            color: var(--muted);
            line-height: 1.6;
            text-align: center;
        }

        .auth-logo {
            display: block;
            width: 84px;
            height: 84px;
            margin: 0 auto 18px;
            border-radius: 18px;
            object-fit: contain;
        }

        .auth-form {
            display: grid;
            gap: 17px;
        }

        .auth-field {
            display: grid;
            gap: 7px;
        }

        .auth-field label {
            color: #17233b;
            font-weight: 850;
        }

        .auth-field input {
            width: 100%;
            border: 1px solid #d9dde5;
            border-radius: 11px;
            padding: 13px 14px;
            background: white;
            color: #17233b;
            font: inherit;
        }

        .auth-field input:focus {
            outline: 3px solid rgba(238, 108, 47, 0.15);
            border-color: #ee6c2f;
        }

        .auth-submit {
            width: 100%;
            margin-top: 4px;
        }

        .auth-message {
            min-height: 24px;
            margin: 0;
            font-weight: 800;
            text-align: center;
        }

        .auth-footer {
            margin-top: 22px;
            color: var(--muted);
            text-align: center;
        }

        .auth-footer a {
            color: #ee6c2f;
            font-weight: 850;
        }
    </style>
</head>

<body>

    <header class="site-header">

        <div class="container nav-wrap">

            <a
                href="index.html"
                class="brand"
                aria-label="Packaged Comfort home"
            >
                <img
                    src="logo.png"
                    alt="Packaged Comfort logo"
                >

                <span class="brand-text">
                    <strong>Packaged</strong>
                    <span>Comfort</span>
                </span>
            </a>


            <button
                class="menu-button"
                id="menuButton"
                type="button"
                aria-label="Open navigation menu"
                aria-expanded="false"
            >
                ☰
            </button>


            <nav
                class="main-nav"
                id="mainNav"
            >
                <a href="index.html">
                    Home
                </a>

                <a href="services.html">
                    Services
                </a>

                <a href="quote.html">
                    Request a Quote
                </a>

                <a href="contact.html">
                    Contact
                </a>

                <div
                    class="nav-actions"
                    data-auth-guest
                >
                    <a
                        href="login.html"
                        class="button button-secondary"
                    >
                        Log In
                    </a>

                    <a
                        href="signup.html"
                        class="button button-primary"
                    >
                        Sign Up
                    </a>
                </div>
            </nav>

        </div>

    </header>


    <main class="auth-page">

        <div class="container">

            <section class="auth-card">

                <img
                    src="logo.png"
                    alt="Packaged Comfort"
                    class="auth-logo"
                >

                <h1>
                    Account Login
                </h1>

                <p>
                    Customers and authorized administrators use this
                    same secure login page.
                </p>


                <form
                    class="auth-form"
                    id="loginForm"
                >

                    <div class="auth-field">

                        <label for="loginEmail">
                            Email address
                        </label>

                        <input
                            type="email"
                            id="loginEmail"
                            autocomplete="email"
                            required
                        >

                    </div>


                    <div class="auth-field">

                        <label for="loginPassword">
                            Password
                        </label>

                        <input
                            type="password"
                            id="loginPassword"
                            autocomplete="current-password"
                            minlength="6"
                            required
                        >

                    </div>


                    <button
                        type="submit"
                        class="button button-primary auth-submit"
                        id="loginButton"
                    >
                        Log In
                    </button>


                    <p
                        class="auth-message"
                        id="authMessage"
                        aria-live="polite"
                    ></p>

                </form>


                <p class="auth-footer">
                    Need a customer account?
                    <a href="signup.html">
                        Create one here
                    </a>
                </p>

            </section>

        </div>

    </main>


    <script src="script.js?v=20"></script>
    <script
        type="module"
        src="auth.js?v=20"
    ></script>

</body>
</html>
