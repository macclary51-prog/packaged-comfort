<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Create Account | Packaged Comfort</title>

    <link rel="icon" type="image/png" href="logo.png">
    <link rel="stylesheet" href="style.css">

    <style>
        .auth-page {
            min-height: calc(100vh - 80px);
            padding: 70px 0;
            background:
                linear-gradient(
                    135deg,
                    #f5f7fa,
                    #fff7f1
                );
        }

        .auth-card {
            width: min(540px, 100%);
            margin: 0 auto;
            border: 1px solid rgba(23, 35, 59, 0.1);
            border-radius: 24px;
            padding: 34px;
            background: white;
            box-shadow:
                0 24px 65px rgba(23, 35, 59, 0.12);
        }

        .auth-logo {
            display: block;
            width: 84px;
            height: 84px;
            margin: 0 auto 18px;
            border-radius: 18px;
            object-fit: contain;
        }

        .auth-card h1,
        .auth-card > p {
            text-align: center;
        }

        .auth-card > p {
            margin-bottom: 25px;
            color: var(--muted);
        }

        .auth-form,
        .auth-field {
            display: grid;
        }

        .auth-form {
            gap: 17px;
        }

        .auth-field {
            gap: 7px;
        }

        .auth-field label {
            font-weight: 850;
        }

        .auth-field input {
            width: 100%;
            border: 1px solid #d9dde5;
            border-radius: 11px;
            padding: 13px 14px;
            font: inherit;
        }

        .auth-message {
            min-height: 24px;
            margin: 0;
            font-weight: 800;
            text-align: center;
        }

        .auth-submit {
            width: 100%;
        }

        .auth-footer {
            margin-top: 21px;
            text-align: center;
        }
    </style>
</head>

<body>

    <header class="site-header">
        <div class="container nav-wrap">

            <a
                href="index.html"
                class="brand"
            >
                <img
                    src="logo.png"
                    alt="Packaged Comfort logo"
                >

                <span class="brand-text">
                    <strong>Packaged</strong>
                    <span>Comfort</span>
                </span>
            </a>


            <button
                class="menu-button"
                id="menuButton"
                type="button"
                aria-label="Open navigation menu"
                aria-expanded="false"
            >
                ☰
            </button>


            <nav
                class="main-nav"
                id="mainNav"
            >
                <a href="index.html">Home</a>
                <a href="services.html">Services</a>
                <a href="quote.html">Request a Quote</a>
                <a href="contact.html">Contact</a>

                <div
                    class="nav-actions"
                    data-auth-guest
                >
                    <a
                        href="login.html"
                        class="button button-secondary"
                    >
                        Log In
                    </a>

                    <a
                        href="signup.html"
                        class="button button-primary"
                    >
                        Sign Up
                    </a>
                </div>
            </nav>

        </div>
    </header>


    <main class="auth-page">

        <div class="container">

            <section class="auth-card">

                <img
                    src="logo.png"
                    alt="Packaged Comfort"
                    class="auth-logo"
                >

                <h1>
                    Create Customer Account
                </h1>

                <p>
                    Create an account to manage your Packaged Comfort
                    service requests.
                </p>


                <form
                    class="auth-form"
                    id="signupForm"
                >

                    <div class="auth-field">
                        <label for="signupName">
                            Full name
                        </label>

                        <input
                            type="text"
                            id="signupName"
                            autocomplete="name"
                            required
                        >
                    </div>


                    <div class="auth-field">
                        <label for="signupEmail">
                            Email address
                        </label>

                        <input
                            type="email"
                            id="signupEmail"
                            autocomplete="email"
                            required
                        >
                    </div>


                    <div class="auth-field">
                        <label for="signupPassword">
                            Password
                        </label>

                        <input
                            type="password"
                            id="signupPassword"
                            autocomplete="new-password"
                            minlength="6"
                            required
                        >
                    </div>


                    <button
                        type="submit"
                        class="button button-primary auth-submit"
                        id="signupButton"
                    >
                        Create Account
                    </button>


                    <p
                        class="auth-message"
                        id="authMessage"
                        aria-live="polite"
                    ></p>

                </form>


                <p class="auth-footer">
                    Already have an account?
                    <a href="login.html">
                        Log in
                    </a>
                </p>

            </section>

        </div>

    </main>


    <script src="script.js?v=20"></script>
    <script
        type="module"
        src="auth.js?v=20"
    ></script>

</body>
</html>
